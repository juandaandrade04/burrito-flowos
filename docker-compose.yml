services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "services/inventory-service/server.js"]
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGO_URI: mongodb://mongodb:27017/burrito_flowos
      JWT_SECRET: ${JWT_SECRET:-burrito_flowos_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4001"

  sales-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "services/sales-service/server.js"]
    environment:
      NODE_ENV: production
      PORT: 4004
      MONGO_URI: mongodb://mongodb:27017/burrito_flowos
      JWT_SECRET: ${JWT_SECRET:-burrito_flowos_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4004"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/burrito_flowos
      JWT_SECRET: ${JWT_SECRET:-burrito_flowos_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      INVENTORY_SERVICE_URL: http://inventory-service:4001
      SALES_SERVICE_URL: http://sales-service:4004
    depends_on:
      mongodb:
        condition: service_healthy
      inventory-service:
        condition: service_started
      sales-service:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  mongo_data:
