x-backend-environment: &backend-environment
  NODE_ENV: production
  MONGO_URI: mongodb://mongodb:27017/burrito_flowos
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/auth-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      PORT: 4002
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4002"
    healthcheck: &service-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/inventory-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      PORT: 4001
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4001"
    healthcheck: *service-healthcheck

  recetas-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/recetas-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      PORT: 4003
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4003"
    healthcheck: *service-healthcheck

  sales-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/sales-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      PORT: 4004
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4004"
    healthcheck: *service-healthcheck

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4001
      RECETAS_SERVICE_URL: http://recetas-service:4003
      SALES_SERVICE_URL: http://sales-service:4004
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      recetas-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck: *service-healthcheck

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
